name: Publish

on:
  push:
  workflow_dispatch:
  repository_dispatch:

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

concurrency:
  group: "teahouse"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: AstraLuma/basicest@trunk
        with:
          root: .
          output: ./_build
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: ./_build

  # Deployment job
  deploy:
    if: github.repository == 'AstraLuma/basicest' && github.ref == 'refs/heads/trunk'
    environment:
      name: teahouse
      url: https://docs.teahouse.cafe
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: ./_build
      - name: Upload
        uses: teahouse-hosting/upload@trunk
        with:
          domain: basicest.ivyleav.es
          root: ./_build
