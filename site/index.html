<Base title="Basicest">
<h1>Basicest</h1>
<p>Basicest is a minimal static site generator:</p>
<ul>
    <li>Every produced file has a source file</li>
    <li>Makes use of components (via <a href="https://jinjax.scaletti.dev/">JinjaX</a>)</li>
    <li>Does not assume you're making a blog, gallery, or any other kind of site</li>
    <li>Does not use the wrong markdown dialect</li>
</ul>
</Base>
