name: 'Basicest SSG Build'
description: 'Build a Basicest project'
inputs:
  root:
    description: 'Root directory of project'
    required: true
  output:  # id of input
    description: 'Directory to build into'
    required: true
    default: .
runs:
  using: "composite"
  steps:
    - name: Install basicest
      shell: bash
      run: |
        pip install -e $GITHUB_ACTION_PATH

    - name: Run basicest
      shell: bash
      run: |
        basicest ${{ inputs.root }} --out ${{ inputs.output }}

branding:
  icon: 'gift'
  color: 'blue'
